# Documentation website, published to GitHub Pages by .github/workflows/docs.yml.
# Preview locally:
#   pip install -r .github/docs-requirements.txt
#   mkdocs serve
site_name: lmw · LinkedinMechaWarrior
site_description: A command-line client for your own LinkedIn account.
site_url: https://marczx10.github.io/LinkedinMechaWarrior/
repo_url: https://github.com/MarcZX10/LinkedinMechaWarrior
repo_name: MarcZX10/LinkedinMechaWarrior
edit_uri: edit/main/docs/
docs_dir: docs
strict: true

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - announce.dismiss
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - content.tooltips

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/MarcZX10/LinkedinMechaWarrior
      name: lmw on GitHub
    - icon: material/download
      link: https://github.com/MarcZX10/LinkedinMechaWarrior/releases/latest
      name: Download the latest release

copyright: MIT licensed · An independent project, not affiliated with LinkedIn

markdown_extensions:
  # GitHub-style "> [!NOTE]" alerts, so the same files read well on GitHub.
  - github-callouts
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

nav:
