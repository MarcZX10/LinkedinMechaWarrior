<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="title desc">
  <title id="title">LinkedinMechaWarrior</title>
  <desc id="desc">lmw: pilot your own LinkedIn from the terminal. A mech head with an amber visor next to the project name and its system status.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07040f"/>
      <stop offset="0.55" stop-color="#170a36"/>
      <stop offset="1" stop-color="#2d1068"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb300" stop-opacity="0.32"/>
      <stop offset="0.6" stop-color="#7c4dff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#7c4dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6f00"/>
      <stop offset="0.5" stop-color="#ffd54f"/>
      <stop offset="1" stop-color="#ff6f00"/>
    </linearGradient>
    <linearGradient id="armor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2373"/>
      <stop offset="1" stop-color="#160b33"/>
    </linearGradient>
    <linearGradient id="titleFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d1c4ff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#b39dff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", Consolas, "DejaVu Sans Mono", monospace; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      .scan { animation: scan 5s linear infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes pulse { 50% { opacity: 0.35; } }
      @keyframes scan { from { transform: translateY(-40px); } to { transform: translateY(440px); } }
      @media (prefers-reduced-motion: reduce) { .cursor, .pulse, .scan { animation: none; } }
    </style>
  </defs>

  <rect width="1280" height="420" rx="18" fill="url(#sky)"/>
  <rect width="1280" height="420" rx="18" fill="url(#grid)"/>
  <rect class="scan" x="0" y="0" width="1280" height="2" fill="#ffb300" opacity="0.08"/>

  <!-- HUD corner brackets -->
  <g fill="none" stroke="#ffb300" stroke-width="3" stroke-linecap="square" opacity="0.85">
    <path d="M28 70V28H70"/>
    <path d="M1210 28H1252V70"/>
    <path d="M28 350V392H70"/>
    <path d="M1252 350V392H1210"/>
  </g>

  <!-- Mech: shoulders, neck, head -->
  <circle cx="1000" cy="200" r="190" fill="url(#halo)"/>
  <g stroke="#9575ff" stroke-width="3" stroke-linejoin="round">
    <polygon points="770,420 800,352 900,330 940,350 930,420" fill="#1d1040"/>
    <polygon points="1230,420 1200,352 1100,330 1060,350 1070,420" fill="#1d1040"/>
    <polygon points="955,306 1045,306 1060,350 940,350" fill="#2a1858"/>
    <line x1="1078" y1="92" x2="1112" y2="40"/>
    <circle class="pulse" cx="1114" cy="36" r="7" fill="#ffb300" stroke="none" filter="url(#glow)"/>
    <polygon points="855,150 880,128 880,282 855,262" fill="#241449"/>
    <polygon points="1145,150 1120,128 1120,282 1145,262" fill="#241449"/>
    <polygon points="900,92 1100,92 1130,140 1120,250 1080,312 920,312 880,250 870,140" fill="url(#armor)"/>
    <polygon points="930,108 1070,108 1084,132 916,132" fill="#4b2f8f" stroke="none"/>
    <polygon points="896,168 1104,168 1092,214 908,214" fill="#0c0620"/>
  </g>
  <g stroke="#7c4dff" stroke-width="2" opacity="0.7">
    <line x1="820" y1="380" x2="900" y2="362"/>
    <line x1="826" y1="396" x2="906" y2="378"/>
    <line x1="1180" y1="380" x2="1100" y2="362"/>
    <line x1="1174" y1="396" x2="1094" y2="378"/>
    <line x1="860" y1="170" x2="874" y2="160"/>
    <line x1="860" y1="190" x2="874" y2="180"/>
    <line x1="860" y1="210" x2="874" y2="200"/>
    <line x1="1140" y1="170" x2="1126" y2="160"/>
    <line x1="1140" y1="190" x2="1126" y2="180"/>
    <line x1="1140" y1="210" x2="1126" y2="200"/>
  </g>
  <polygon points="1000,98 930,46 946,44 1000,82 1054,44 1070,46" fill="#ffb300" stroke="#ffd54f" stroke-width="1.5" filter="url(#glow)"/>
  <text x="80" y="64" class="mono" font-size="13" fill="#ffb300" opacity="0.75" letter-spacing="3">UNIT LMW-01 // PILOT: YOU</text>
  <polygon points="904,176 1096,176 1088,206 912,206" fill="url(#visor)" filter="url(#glow)"/>
  <rect class="cursor" x="960" y="184" width="80" height="14" rx="3" fill="#fff8e1" opacity="0.9"/>
  <g stroke="#7c4dff" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <line x1="950" y1="248" x2="1050" y2="248"/>
    <line x1="958" y1="264" x2="1042" y2="264"/>
    <line x1="968" y1="280" x2="1032" y2="280"/>
  </g>
  <text x="1000" y="127" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#ffb300" letter-spacing="6">LMW-01</text>

  <!-- Title -->
  <text x="78" y="118" class="mono" font-size="24" font-weight="700" fill="#ffb300" letter-spacing="14">LINKEDIN</text>
  <text x="74" y="200" class="mono" font-size="74" font-weight="800" fill="url(#titleFill)" letter-spacing="2">MECHAWARRIOR</text>
  <text x="80" y="250" class="mono" font-size="26" fill="#d1c4ff">$ lmw<tspan fill="#ffb300"> --pilot your-own-account</tspan><tspan class="cursor" fill="#ffb300">█</tspan></text>

  <!-- System status -->
  <g class="mono" font-size="17" fill="#b9a8ff">
    <text x="80" y="306">SESSION ······· <tspan fill="#69f0ae" font-weight="700">ONLINE</tspan></text>
    <text x="80" y="334">PACING ········ <tspan fill="#69f0ae" font-weight="700">HUMAN</tspan></text>
    <text x="80" y="362">AI CO-PILOT ··· <tspan fill="#ffb300" font-weight="700">MCP READY</tspan></text>
    <text x="440" y="306">TLS ·········· <tspan fill="#69f0ae" font-weight="700">CHROME MATCH</tspan></text>
    <text x="440" y="334">SAFETY ······· <tspan fill="#69f0ae" font-weight="700">ON</tspan></text>
    <text x="440" y="362">BULK MODE ···· <tspan fill="#ff5252" font-weight="700">DISABLED</tspan></text>
  </g>
  <circle class="pulse" cx="62" cy="300" r="5" fill="#69f0ae"/>
</svg>
